<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    
    <!-- Gradiente do Ícone -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Fundo Arredondado do App (Estilo Ícone de Aplicativo) -->
  <rect x="50" y="50" width="400" height="400" rx="90" fill="url(#bgGrad)" />

  <!-- Nota Fiscal / Documento -->
  <path d="M160 130 H300 L340 170 V360 C340 371 331 380 320 380 H160 C149 380 140 371 140 360 V150 C140 139 149 130 160 130 Z" 
        fill="none" stroke="url(#iconGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Linhas simulando o texto/itens da Nota Fiscal -->
  <line x1="180" y1="190" x2="300" y2="190" stroke="#94A3B8" stroke-width="12" stroke-linecap="round" />
  <line x1="180" y1="230" x2="260" y2="230" stroke="#94A3B8" stroke-width="12" stroke-linecap="round" />
  <line x1="180" y1="270" x2="220" y2="270" stroke="#94A3B8" stroke-width="12" stroke-linecap="round" />

  <!-- Círculo e Checkmark de Confirmação/Aprovação -->
  <circle cx="320" cy="320" r="42" fill="#10B981" />
  <path d="M300 320 L314 334 L342 304" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
