<div class="min-h-screen flex flex-col">

  <!-- ── Navbar ── -->
  <nav class="sticky top-0 z-40 border-b border-white/5"
    style="background: rgba(2,6,23,0.85); backdrop-filter: blur(20px);">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-3 group">
        <img src="/assets/logo.svg" alt="Korp ERP" class="h-10 w-auto">
        <span class="text-lg font-bold text-gradient">Korp ERP</span>
      </a>

      <!-- Right Side: Nav Links & Status -->
      <div class="flex items-center gap-6">
        <!-- Nav Links -->
        <div class="flex items-center gap-1">
          <a routerLink="/" routerLinkActive="text-primary-500 font-bold" [routerLinkActiveOptions]="{exact: true}"
            class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-surface-400
                    hover:text-white hover:bg-white/5 transition-all duration-200">
            Home
          </a>
          <a routerLink="/produtos" routerLinkActive="text-primary-500 font-bold" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-surface-400
                    hover:text-white hover:bg-white/5 transition-all duration-200">
            Produtos
          </a>
          <a routerLink="/notas-fiscais" routerLinkActive="text-primary-500 font-bold" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-surface-400
                    hover:text-white hover:bg-white/5 transition-all duration-200">
            Notas Fiscais
          </a>
        </div>

        <!-- Status Badge -->
        <div class="flex items-center gap-2 text-xs text-surface-500 pl-4 border-l border-white/5">
          <span class="w-2 h-2 rounded-full bg-success animate-pulse-slow"></span>
          Sistema Online
        </div>
      </div>
    </div>
  </nav>

  <!-- ── Main Content ── -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8">
    <router-outlet />
  </main>

  <!-- ── Footer ── -->
  <footer class="border-t border-white/5 py-4 text-center text-xs text-surface-600">
    Korp ERP &copy; {{ currentYear }} — Sistema de Emissão de Notas Fiscais
  </footer>
</div>

<!-- ── Toast Container ── -->
<app-toast-container />
